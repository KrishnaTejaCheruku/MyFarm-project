spring.application.name=myfarm-api
server.port=${SERVER_PORT:8082}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.data.redis.repositories.enabled=false

# Catalog read cache (Phase 4 -- see CatalogCacheConfiguration).
# Bounded TTL rather than eviction-on-write since there's no
# catalog write path yet.
spring.cache.type=redis
spring.cache.redis.time-to-live=5m

# Product search (Phase 4 -- see the search package and
# catalog.CatalogSearchIndexService). Local dev/tests get this
# from TestcontainersConfiguration's OpenSearchContainer; a
# persistent deployment needs its own OpenSearch instance.
myfarm.opensearch.base-url=${OPENSEARCH_BASE_URL:http://localhost:9200}
spring.mvc.problemdetails.enabled=true

spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}

myfarm.cors.allowed-origins=http://localhost:5173

# Identity (phase 2). Local/dev-only secret baked into
# infra/identity/myfarm-realm.json -- a real deployment needs its own
# generated secret injected via env var (secrets management is a later
# phase, see infra/identity's docker-compose.yml comment).
myfarm.keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8083}
myfarm.keycloak.realm=myfarm
myfarm.keycloak.bridge-client-id=identity-bridge
myfarm.keycloak.bridge-client-secret=${KEYCLOAK_BRIDGE_CLIENT_SECRET:myfarm-identity-bridge-secret}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${myfarm.keycloak.base-url}/realms/${myfarm.keycloak.realm}

# No SMS gateway integrated yet -- this is the only way to complete the
# OTP flow locally today. MUST be false before this API is reachable by
# anyone other than the developer running it.
myfarm.otp.expose-in-response=${MYFARM_OTP_EXPOSE_IN_RESPONSE:true}
