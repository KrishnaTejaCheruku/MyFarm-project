apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx-demo
  namespace: default
spec:
  parentRefs:
    - name: traefik-gateway # auto-created by the traefik chart's gateway.listeners block
  hostnames:
    - "nginx-demo.localhost"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nginx-demo
          port: 80
